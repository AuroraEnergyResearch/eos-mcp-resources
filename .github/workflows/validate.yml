name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Validate skill packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package skills
        run: python scripts/package_skills.py dist

      - name: Test archives
        run: |
          for archive in dist/*.zip; do
            python -m zipfile --test "$archive"
          done
